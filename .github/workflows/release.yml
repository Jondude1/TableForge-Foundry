name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Build module.zip (module files at zip root, per Foundry convention)
        run: |
          zip -r module.zip module.json README.md SPEC.md CREDITS.md LICENSE scripts templates styles -x "*.DS_Store*"

      - name: Publish GitHub Release with module.json and module.zip
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
